databases:
  - name: quizpilot-db
    plan: free
    databaseName: quizpilot
    user: quizpilot_user

services:
  - type: redis
    name: quizpilot-redis
    plan: free
    ipAllowList: [] # only allow internal connections

  - type: web
    name: quizpilot-backend
    env: python
    plan: free
    buildCommand: "python -m pip install -U pip && pip install uv && uv pip install --system -r pyproject.toml && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "celery -A root worker --detach && daphne -b 0.0.0.0 -p $PORT root.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: quizpilot-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false # You will need to enter this in the Render dashboard
      - key: FRONTEND_URL
        sync: false # You will need to enter your Vercel URL here
