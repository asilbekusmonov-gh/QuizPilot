databases:
  - name: quizpilot-db
    plan: free
    databaseName: quizpilot
    user: quizpilot_user

  - name: quizpilot-redis
    type: redis
    plan: free
    ipAllowList: [] # only allow internal connections

services:
  - type: web
    name: quizpilot-backend
    env: python
    plan: free
    buildCommand: "python -m pip install -U pip && pip install uv && uv pip install --system -r pyproject.toml && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT root.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizpilot-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: quizpilot-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false # You will need to enter this in the Render dashboard
      - key: FRONTEND_URL
        sync: false # You will need to enter your Vercel URL here

  - type: worker
    name: quizpilot-worker
    env: python
    plan: starter # Render does not have a free tier for background workers ($7/mo)
    buildCommand: "python -m pip install -U pip && pip install uv && uv pip install --system -r pyproject.toml"
    startCommand: "celery -A root worker -l info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizpilot-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: quizpilot-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
