{% extends "admin/index.html" %}

{% block content %}
<div class="custom-dashboard" style="display: flex; gap: 20px; margin-bottom: 30px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div style="background: #2c2c2c; padding: 24px; border-radius: 12px; flex: 1; text-align: center; color: white; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <h3 style="margin-top: 0; color: #aaa; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Total Users</h3>
        <p style="font-size: 32px; font-weight: 800; margin: 10px 0 0 0; color: #6366f1;">{{ total_users }}</p>
    </div>
    <div style="background: #2c2c2c; padding: 24px; border-radius: 12px; flex: 1; text-align: center; color: white; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <h3 style="margin-top: 0; color: #aaa; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Quizzes Today</h3>
        <p style="font-size: 32px; font-weight: 800; margin: 10px 0 0 0; color: #10b981;">{{ quizzes_today }} <span style="font-size: 16px; color: #666;">/ {{ total_quizzes }}</span></p>
    </div>
    <div style="background: #2c2c2c; padding: 24px; border-radius: 12px; flex: 1; text-align: center; color: white; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <h3 style="margin-top: 0; color: #aaa; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Revenue Today</h3>
        <p style="font-size: 32px; font-weight: 800; margin: 10px 0 0 0; color: #f59e0b;">${{ revenue_today }}</p>
    </div>
    <div style="background: #2c2c2c; padding: 24px; border-radius: 12px; flex: 1; text-align: center; color: white; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <h3 style="margin-top: 0; color: #aaa; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Active Subs</h3>
        <p style="font-size: 32px; font-weight: 800; margin: 10px 0 0 0; color: #ec4899;">{{ active_subscriptions }}</p>
    </div>
</div>

{{ block.super }}
{% endblock %}
